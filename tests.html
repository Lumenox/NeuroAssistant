<h1>Tests de core.js (couche stockage et chiffrement)</h1>
<div id="summary">Exécution…</div>
<div id="results"></div>

<script src="core.js"></script>
<script>
// ===================== mini-harnais =====================
const _tests = [];
let _section = '';
function section(titre) { _tests.push({ section: titre }); }
function test(nom, fn) { _tests.push({ nom, fn }); }

function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion fausse'); }
function assertEq(a, b, msg) {
  const sa = JSON.stringify(a), sb = JSON.stringify(b);
  if (sa !== sb) throw new Error((msg ? msg + ' : ' : '') + 'attendu ' + sb + ', obtenu ' + sa);
}
// Vérifie qu'une promesse échoue avec un NVError du code donné.
async function expectCode(promesse, code) {
  try { await promesse; }
  catch (e) {
    if (!(e instanceof NVCore.NVError)) throw new Error("erreur non convertie en NVError : " + (e && e.name) + ' ' + (e && e.message));
    if (e.code !== code) throw new Error('code attendu ' + code + ', obtenu ' + e.code);
    return;
  }
  throw new Error("aucune erreur levée (attendu " + code + ")");
}
function same(a, b) { return a.length === b.length && a.every((x, i) => x === b[i]); }
function flip(bytes, idx) { const c = bytes.slice(); c[idx] ^= 0xff; return c; }
function setByte(bytes, idx, val) { const c = bytes.slice(); c[idx] = val; return c; }
function shuffled(arr, seed) {
  const a = arr.slice(); let s = seed;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    const j = s % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const D = new Date(Date.UTC(2026, 9, 27, 22, 3, 0));
const name = (v, a, alea) => NVCore.buildFileName({ version: v, auteur: a || 'RM', date: D, alea: alea || 'a1b2c3' });
const SAMPLE = {
  visite_id: 'v-1', episode_id: 'e-1', ipp: '9912345678', version: 1, parent_version: null,
  auteur: 'RM', date_saisie: '2026-10-27T22:03:00Z', statut: 'actif',
  items: { 'mmse.orientation.annee': 1, 'texte.libre': 'très ça va' }
};

// ===================== tests : chiffrement =====================
section('Chiffrement');

test('1. Aller-retour : l\'objet récupéré est identique', async () => {
  const key = await NVCore.generateDataKey();
  const enc = await NVCore.encryptVersion(SAMPLE, key, 7);
  const dec = await NVCore.decryptVersion(enc, key);
  assertEq(dec.obj, SAMPLE);
  assertEq(dec.keyId, 7, 'key_id');
  assertEq(dec.formatVersion, 1, 'format_version');
});

test('2a. Aller-retour : accents, emojis, guillemets', async () => {
  const key = await NVCore.generateDataKey();
  const obj = { items: { a: 'é à ç œ « » " \' \\ \n 😀 日本語' } };
  const dec = await NVCore.decryptVersion(await NVCore.encryptVersion(obj, key, 1), key);
  assertEq(dec.obj, obj);
});
test('2b. Aller-retour : items vide', async () => {
  const key = await NVCore.generateDataKey();
  const obj = { items: {} };
  const dec = await NVCore.decryptVersion(await NVCore.encryptVersion(obj, key, 1), key);
  assertEq(dec.obj, obj);
});
test('2c. Aller-retour : objet d\'environ 100 ko', async () => {
  const key = await NVCore.generateDataKey();
  const obj = { items: { gros: 'x'.repeat(100000) } };
  const dec = await NVCore.decryptVersion(await NVCore.encryptVersion(obj, key, 1), key);
  assertEq(dec.obj.items.gros.length, 100000);
});

test('3. Deux chiffrements du même objet donnent des octets différents (IV distincts)', async () => {
  const key = await NVCore.generateDataKey();
  const a = await NVCore.encryptVersion(SAMPLE, key, 1);
  const b = await NVCore.encryptVersion(SAMPLE, key, 1);
  assert(!same(a, b), 'octets identiques');
  assert(!same(a.slice(7, 19), b.slice(7, 19)), 'IV identiques');
});

test('4. Mauvaise clé → AUTH_FAILED', async () => {
  const k1 = await NVCore.generateDataKey();
  const k2 = await NVCore.generateDataKey();
  const enc = await NVCore.encryptVersion(SAMPLE, k1, 1);
  await expectCode(NVCore.decryptVersion(enc, k2), 'AUTH_FAILED');
});

test('5. Export/import de la clé en base64 : l\'ancien fichier se déchiffre', async () => {
  const key = await NVCore.generateDataKey();
  const enc = await NVCore.encryptVersion(SAMPLE, key, 1);
  const b64 = await NVCore.exportKeyBase64(key);
  const key2 = await NVCore.importKeyBase64(b64);
  const dec = await NVCore.decryptVersion(enc, key2);
  assertEq(dec.obj, SAMPLE);
});

test('5b. key_id hors plage refusé à l\'écriture', async () => {
  const key = await NVCore.generateDataKey();
  await expectCode(NVCore.encryptVersion(SAMPLE, key, 70000), 'BAD_INPUT');
  await expectCode(NVCore.encryptVersion(SAMPLE, key, -1), 'BAD_INPUT');
});

// ===================== tests : altération =====================
section('Altération (sur un fichier valide)');

async function fichierValide() {
  const key = await NVCore.generateDataKey();
  const obj = { items: { texte: 'a'.repeat(200) } };   // assez long pour les troncatures
  const enc = await NVCore.encryptVersion(obj, key, 3);
  return { key, enc };
}

test('6. Fichier vide → TRUNCATED', async () => {
  const { key } = await fichierValide();
  await expectCode(NVCore.decryptVersion(new Uint8Array(0), key), 'TRUNCATED');
});
test('7. Fichier de 20 octets → TRUNCATED', async () => {
  const { key, enc } = await fichierValide();
  await expectCode(NVCore.decryptVersion(enc.slice(0, 20), key), 'TRUNCATED');
});
test('8. Fichier valide tronqué de 10 octets en fin → AUTH_FAILED', async () => {
  const { key, enc } = await fichierValide();
  await expectCode(NVCore.decryptVersion(enc.slice(0, enc.length - 10), key), 'AUTH_FAILED');
});
test('9a. Octet du magic modifié → BAD_MAGIC', async () => {
  const { key, enc } = await fichierValide();
  await expectCode(NVCore.decryptVersion(flip(enc, 0), key), 'BAD_MAGIC');
  await expectCode(NVCore.decryptVersion(flip(enc, 3), key), 'BAD_MAGIC');
});
test('9b. format_version inconnue → UNSUPPORTED_VERSION', async () => {
  const { key, enc } = await fichierValide();
  await expectCode(NVCore.decryptVersion(setByte(enc, 4, 99), key), 'UNSUPPORTED_VERSION');
  await expectCode(NVCore.decryptVersion(setByte(enc, 4, 0), key), 'UNSUPPORTED_VERSION');
});
test('9c. key_id modifié → AUTH_FAILED', async () => {
  const { key, enc } = await fichierValide();
  await expectCode(NVCore.decryptVersion(flip(enc, 5), key), 'AUTH_FAILED');
  await expectCode(NVCore.decryptVersion(flip(enc, 6), key), 'AUTH_FAILED');
});
test('9d. IV modifié → AUTH_FAILED', async () => {
  const { key, enc } = await fichierValide();
  await expectCode(NVCore.decryptVersion(flip(enc, 7), key), 'AUTH_FAILED');
  await expectCode(NVCore.decryptVersion(flip(enc, 18), key), 'AUTH_FAILED');
});
test('9e. Milieu du contenu modifié → AUTH_FAILED', async () => {
  const { key, enc } = await fichierValide();
  await expectCode(NVCore.decryptVersion(flip(enc, 19 + 50), key), 'AUTH_FAILED');
});
test('9f. Dernier octet (tag) modifié → AUTH_FAILED', async () => {
  const { key, enc } = await fichierValide();
  await expectCode(NVCore.decryptVersion(flip(enc, enc.length - 1), key), 'AUTH_FAILED');
});
test('10. key_id modifié détecté : prouve que l\'AAD fonctionne', async () => {
  const { key, enc } = await fichierValide();
  const dec = await NVCore.decryptVersion(enc, key);
  assertEq(dec.keyId, 3, 'key_id d\'origine');
  // On change key_id 3 -> 4 : seul l'en-tête diffère, le contenu chiffré est intact.
  await expectCode(NVCore.decryptVersion(setByte(enc, 6, 4), key), 'AUTH_FAILED');
});
test('10b. Entrée de mauvais type → BAD_INPUT', async () => {
  const { key } = await fichierValide();
  await expectCode(NVCore.decryptVersion('pas des octets', key), 'BAD_INPUT');
});

// ===================== tests : noms et versions =====================
section('Noms et versions');

test('11. buildFileName puis parseFileName redonnent les mêmes valeurs', () => {
  const n = name(7, 'RM', 'a1b2c3');
  assertEq(n, 'v0007_RM_20261027T220300Z_a1b2c3.enc');
  const p = NVCore.parseFileName(n);
  assertEq(p.version, 7);
  assertEq(p.auteur, 'RM');
  assertEq(p.dateStr, '20261027T220300Z');
  assertEq(p.alea, 'a1b2c3');
  assertEq(p.date.getTime(), D.getTime());
});
test('11b. Alea généré automatiquement et différent d\'un appel à l\'autre', () => {
  const a = NVCore.buildFileName({ version: 1, auteur: 'RM', date: D });
  const b = NVCore.buildFileName({ version: 1, auteur: 'RM', date: D });
  assert(NVCore.parseFileName(a) && NVCore.parseFileName(b), 'noms invalides');
  assert(a !== b, 'deux alea identiques (très improbable : 1 chance sur 16 millions)');
});
test('11c. buildFileName refuse les entrées invalides', () => {
  const bad = [
    { version: 0, auteur: 'RM', date: D },
    { version: 10000, auteur: 'RM', date: D },
    { version: 1, auteur: 'rm', date: D },
    { version: 1, auteur: 'R M', date: D },
    { version: 1, auteur: '', date: D },
    { version: 1, auteur: 'RM', date: new Date('nope') },
    { version: 1, auteur: 'RM', date: D, alea: 'ZZZZZZ' }
  ];
  bad.forEach((args, i) => {
    let threw = false;
    try { NVCore.buildFileName(args); } catch (e) { threw = e instanceof NVCore.NVError; }
    assert(threw, 'entrée invalide n° ' + i + ' acceptée');
  });
});
test('12. parseFileName renvoie null pour les noms non conformes', () => {
  const rejets = [
    'Thumbs.db', 'desktop.ini', '~$v0001.enc',
    'v7_AB_x.enc',
    'v0007_ab_20261027T220300Z_a1b2c3.enc',          // auteur en minuscules
    'v0007_AB_20261027T220300Z_a1b2c3.enc.tmp',
    'v0007_AB_20261027T220300Z_a1b2c3 (copie).enc',
    'v0007_AB_20261327T220300Z_a1b2c3.enc',          // mois 13
    'v0007_AB_20260231T220300Z_a1b2c3.enc',          // 31 février
    'v0000_AB_20261027T220300Z_a1b2c3.enc',          // version 0
    'v0007_AB_20261027T220300Z_A1B2C3.enc',          // alea en majuscules
    ''
  ];
  rejets.forEach(n => assertEq(NVCore.parseFileName(n), null, JSON.stringify(n)));
  assertEq(NVCore.parseFileName(undefined), null, 'undefined');
});
test('13. Versions mélangées : courante = v0003, quel que soit l\'ordre', () => {
  const liste = [name(3, 'AB', 'aaaaaa'), name(1, 'AB', 'bbbbbb'), name(2, 'CD', 'cccccc')];
  for (let seed = 1; seed <= 8; seed++) {
    const r = NVCore.resolveVersions(shuffled(liste, seed));
    assertEq(r.courante, name(3, 'AB', 'aaaaaa'), 'seed ' + seed);
    assertEq(r.bifurcations, []);
    assertEq(r.lacunes, []);
  }
});
test('14. Deux fichiers v0004 : courante = null et bifurcation signalée', () => {
  const a = name(4, 'AB', 'aaaaaa'), b = name(4, 'CD', 'bbbbbb');
  const r = NVCore.resolveVersions([name(1), name(2, 'AB', 'dddddd'), name(3, 'AB', 'eeeeee'), b, a]);
  assertEq(r.courante, null);
  assertEq(r.bifurcations, [{ version: 4, fichiers: [a, b].sort() }]);
});
test('15. Deux v0002 alors que v0003 existe : courante = v0003, bifurcation au niveau 2', () => {
  const a = name(2, 'AB', 'aaaaaa'), b = name(2, 'CD', 'bbbbbb');
  const v3 = name(3, 'AB', 'cccccc');
  const r = NVCore.resolveVersions([a, v3, name(1), b]);
  assertEq(r.courante, v3);
  assertEq(r.bifurcations, [{ version: 2, fichiers: [a, b].sort() }]);
});
test('16. Liste vide : courante = null, pas d\'exception', () => {
  const r = NVCore.resolveVersions([]);
  assertEq(r.courante, null);
  assertEq(r.bifurcations, []);
  assertEq(r.ignores, []);
  assertEq(NVCore.resolveVersions(undefined).courante, null, 'undefined');
});
test('17. Fichiers parasites : dans ignores, sans effet sur le reste', () => {
  const v1 = name(1), v2 = name(2, 'AB', 'dddddd');
  const r = NVCore.resolveVersions(['Thumbs.db', v1, name(2) + '.tmp', v2, 'desktop.ini']);
  assertEq(r.courante, v2);
  assertEq(r.ignores, ['Thumbs.db', name(2) + '.tmp', 'desktop.ini'].sort());
  assertEq(r.bifurcations, []);
});
test('17b. Lacune de numérotation signalée (sans être une erreur)', () => {
  const r = NVCore.resolveVersions([name(1), name(3, 'AB', 'dddddd')]);
  assertEq(r.courante, name(3, 'AB', 'dddddd'));
  assertEq(r.lacunes, [2]);
});
test('17c. Le même nom présent deux fois dans la liste n\'est pas une bifurcation', () => {
  const r = NVCore.resolveVersions([name(1), name(1)]);
  assertEq(r.courante, name(1));
  assertEq(r.bifurcations, []);
});

// ===================== tests : contenu et graphe (Bloc 2) =====================
// Cas de référence du § 15 de BLOC2_specification.md. Numérotation B2-xx ; le cas du § 15 est indiqué entre crochets.
section('Contenu et graphe (Bloc 2)');

const G_IPP = '9912345678', G_VID = 'visite-0001', G_EPI = 'epi-0001';
function rec(version, parents, over) {
  return Object.assign({ schema: 1, ipp: G_IPP, visite_id: G_VID, episode_id: G_EPI, version, parents,
    auteur: 'RM', date_saisie: '2026-10-27T22:03:00.000Z', statut: 'actif', items: {} }, over || {});
}
const gname = (version, auteur, sec, alea) => NVCore.buildFileName({ version, auteur,
  date: new Date(Date.UTC(2026, 9, 27, 22, 3, sec)), alea });
const fid = n => NVCore.fidOf(n);
let _gkey = null;
async function gkey() { if (!_gkey) _gkey = await NVCore.generateDataKey(); return _gkey; }
// Chiffre puis relit via readEntry, comme le ferait l'application.
async function gentry(nom, obj, opts) {
  const key = await gkey();
  const bytes = (opts && opts.bytes) || await NVCore.encryptVersion(obj, key, 1);
  return NVCore.readEntry({ nom, bytes, key: (opts && opts.key) || key, ipp: G_IPP, visite_id: G_VID });
}
function assertCode(e, code) { assert(!e.obj && e.code === code, 'attendu ' + code + ', obtenu ' + (e.obj ? 'lisible' : e.code)); }

// Noms utilisés : v1 puis v2 (deux auteurs, même seconde), etc.
const N1 = gname(1, 'RM', 0, 'aaaaaa');
const N2a = gname(2, 'PA', 10, 'bbbbbb');
const N2b = gname(2, 'PB', 10, 'a0a0a0');
const N3 = gname(3, 'RM', 20, 'cccccc');

test('B2-01 [1] Visite normale à 3 versions : une tête, version suivante 4', async () => {
  const e = [await gentry(N1, rec(1, [])), await gentry(gname(2, 'RM', 10, 'bbbbbb'), rec(2, [fid(N1)])),
    await gentry(N3, rec(3, [fid(gname(2, 'RM', 10, 'bbbbbb'))]))];
  const r = NVCore.resolveGraph(e);
  assertEq(r.etat, 'normal'); assertEq(r.courante, N3); assertEq(r.tetes, [N3]);
  assertEq(r.versionSuivante, 4); assertEq(r.parentsSuivants, [fid(N3)]);
  assertEq(r.illisibles, []); assertEq(r.parentsManquants, []);
});

test('B2-02 [2] Visite vide : état vide, version suivante 1', () => {
  const r = NVCore.resolveGraph([]);
  assertEq(r.etat, 'vide'); assertEq(r.courante, null); assertEq(r.tetes, []);
  assertEq(r.versionSuivante, 1); assertEq(r.parentsSuivants, []);
  assertEq(NVCore.resolveGraph(null).etat, 'vide');
});

test('B2-03 [3] Écriture interrompue (fichier vide) : ignoré, numéro non réutilisé', async () => {
  const vide = await gentry(N2a, null, { bytes: new Uint8Array(0) });
  assertCode(vide, 'TRUNCATED');
  // a) seule la v1 est lisible, la v2 est vide : courante = v1, suivante = 3
  const r1 = NVCore.resolveGraph([await gentry(N1, rec(1, [])), vide]);
  assertEq(r1.etat, 'normal'); assertEq(r1.courante, N1); assertEq(r1.versionSuivante, 3);
  assertEq(r1.illisibles.map(x => [x.nom, x.code]), [[N2a, 'TRUNCATED']]);
  // b) la v3 a été écrite ensuite avec pour parent la v1 : une seule tête, aucune bifurcation
  const r2 = NVCore.resolveGraph([await gentry(N1, rec(1, [])), vide, await gentry(N3, rec(3, [fid(N1)]))]);
  assertEq(r2.etat, 'normal'); assertEq(r2.courante, N3); assertEq(r2.versionSuivante, 4);
});

test('B2-03b Dossier ne contenant que des fichiers illisibles : vide, mais numéro suivant tient compte des noms', async () => {
  const r = NVCore.resolveGraph([await gentry(N2a, null, { bytes: new Uint8Array(0) })]);
  assertEq(r.etat, 'vide'); assertEq(r.illisibles.length, 1); assertEq(r.versionSuivante, 3);
});

test('B2-04 [4] Bifurcation : deux v2 de même parent = deux têtes, ordre déterministe', async () => {
  const e = [await gentry(N1, rec(1, [])), await gentry(N2a, rec(2, [fid(N1)], { auteur: 'PA' })),
    await gentry(N2b, rec(2, [fid(N1)], { auteur: 'PB' }))];
  const r = NVCore.resolveGraph(e);
  assertEq(r.etat, 'bifurcation'); assertEq(r.courante, null);
  assertEq(r.tetes, [N2b, N2a]);                        // même seconde : départage par alea (a0a0a0 < bbbbbb)
  assertEq(r.parentsSuivants, [fid(N2b), fid(N2a)]);
  assertEq(r.versionSuivante, 3);
});

test('B2-04b L\'horodatage prime sur l\'alea dans l\'ordre entre branches', async () => {
  const tard = gname(2, 'PA', 12, '000001'), tot = gname(2, 'PB', 11, 'ffffff');
  const r = NVCore.resolveGraph([await gentry(N1, rec(1, [])), await gentry(tard, rec(2, [fid(N1)])),
    await gentry(tot, rec(2, [fid(N1)]))]);
  assertEq(r.tetes, [tot, tard]);
});

test('B2-04c Résultat identique quel que soit l\'ordre des entrées (20 mélanges)', async () => {
  const e = [await gentry(N1, rec(1, [])), await gentry(N2a, rec(2, [fid(N1)])), await gentry(N2b, rec(2, [fid(N1)])),
    await gentry(N3, rec(3, [fid(N1)])), await gentry('notes.txt', null, { bytes: new Uint8Array(0) })];
  const ref = JSON.stringify(NVCore.resolveGraph(e));
  for (let s = 1; s <= 20; s++) assert(JSON.stringify(NVCore.resolveGraph(shuffled(e, s))) === ref, 'résultat différent au mélange ' + s);
});

test('B2-04d Base périmée : v2 et v3 issues de la même v1 = bifurcation de numéros différents', async () => {
  const r = NVCore.resolveGraph([await gentry(N1, rec(1, [])), await gentry(N2a, rec(2, [fid(N1)])),
    await gentry(N3, rec(3, [fid(N1)]))]);
  assertEq(r.etat, 'bifurcation'); assertEq(r.tetes, [N2a, N3]); assertEq(r.versionSuivante, 4);
});

test('B2-05 [5] Bifurcation puis fusion à deux parents : une seule tête', async () => {
  const e = [await gentry(N1, rec(1, [])), await gentry(N2a, rec(2, [fid(N1)])), await gentry(N2b, rec(2, [fid(N1)]))];
  const avant = NVCore.resolveGraph(e);
  const fusion = NVCore.buildContent({ ipp: G_IPP, visite_id: G_VID, episode_id: G_EPI, auteur: 'RM', items: { a: 1 } }, avant, null);
  assertEq(fusion.version, 3); assertEq(fusion.parents, [fid(N2b), fid(N2a)]);
  const nomF = gname(3, 'RM', 30, 'dddddd');
  const apres = NVCore.resolveGraph(e.concat([await gentry(nomF, fusion)]));
  assertEq(apres.etat, 'normal'); assertEq(apres.courante, nomF); assertEq(apres.versionSuivante, 4);
});

test('B2-06 [6] Parent manquant : signalé, sans bloquer', async () => {
  const absent = gname(2, 'XX', 5, 'eeeeee');
  const r = NVCore.resolveGraph([await gentry(N1, rec(1, [])), await gentry(N3, rec(3, [fid(N1), fid(absent)]))]);
  assertEq(r.etat, 'normal'); assertEq(r.courante, N3);
  assertEq(r.parentsManquants, [{ nom: N3, parent: fid(absent) }]);
});

test('B2-07 [7] Fichier altéré : chaque zone → code attendu, jamais lisible', async () => {
  const key = await gkey();
  const ok = await NVCore.encryptVersion(rec(1, []), key, 1);
  const cas = [[0, 'BAD_MAGIC'], [4, 'UNSUPPORTED_VERSION'], [5, 'AUTH_FAILED'], [6, 'AUTH_FAILED'],
    [10, 'AUTH_FAILED'], [19, 'AUTH_FAILED'], [30, 'AUTH_FAILED'], [ok.length - 1, 'AUTH_FAILED']];
  for (const [idx, code] of cas) assertCode(await gentry(N1, null, { bytes: flip(ok, idx) }), code);
  assertCode(await gentry(N1, null, { bytes: ok.slice(0, ok.length - 10) }), 'AUTH_FAILED');
  assertCode(await gentry(N1, null, { bytes: ok.slice(0, 20) }), 'TRUNCATED');
  // un fichier altéré dans un dossier : ignoré pour la résolution, listé
  const r = NVCore.resolveGraph([await gentry(N1, rec(1, [])), await gentry(N2a, null, { bytes: flip(ok, 30) })]);
  assertEq(r.courante, N1); assertEq(r.illisibles[0].code, 'AUTH_FAILED');
});

test('B2-08 [8] Mauvaise clé → AUTH_FAILED', async () => {
  const autre = await NVCore.generateDataKey();
  assertCode(await gentry(N1, rec(1, []), { key: autre }), 'AUTH_FAILED');
});

test('B2-09 [9] Concordance chemin / nom / contenu : MISMATCH', async () => {
  assertCode(await gentry(N1, rec(1, [], { ipp: '9900000001' })), 'MISMATCH');
  assertCode(await gentry(N1, rec(1, [], { visite_id: 'autre-visite' })), 'MISMATCH');
  assertCode(await gentry(N2a, rec(1, [])), 'MISMATCH');             // contenu v1 dans un fichier nommé v2
  assertCode(await gentry('notes.txt', rec(1, [])), 'MISMATCH');
  assert((await gentry(N1, rec(1, []))).obj, 'le cas conforme doit rester lisible');
});

test('B2-10 [10] Pierre tombale : motif obligatoire, restauration possible', async () => {
  assertCode(await gentry(N2a, rec(2, [fid(N1)], { statut: 'annule' })), 'BAD_PAYLOAD');
  assertCode(await gentry(N2a, rec(2, [fid(N1)], { statut: 'annule', motif: '   ' })), 'BAD_PAYLOAD');
  const tomb = await gentry(N2a, rec(2, [fid(N1)], { statut: 'annule', motif: 'saisie sur le mauvais patient' }));
  assert(tomb.obj, 'tombstone avec motif lisible');
  const r1 = NVCore.resolveGraph([await gentry(N1, rec(1, [])), tomb]);
  assertEq(r1.etat, 'normal'); assertEq(r1.courante, N2a);
  // restauration = nouvelle version « actif » ; redirige_vers du précédent n'est pas recopié
  const precedent = rec(2, [fid(N1)], { statut: 'annule', motif: 'x', redirige_vers: { ipp: '9900000002', visite_id: 'v-2' } });
  const rest = NVCore.buildContent({ ipp: G_IPP, visite_id: G_VID, episode_id: G_EPI, auteur: 'RM' }, r1, precedent);
  assertEq(rest.statut, 'actif'); assert(!('redirige_vers' in rest) && !('motif' in rest), 'champs d\'annulation non recopiés');
});

test('B2-14 Validation structurelle : IPP, parents, champs facultatifs', async () => {
  const v = o => { try { NVCore.validateContent(o); return null; } catch (e) { return e.code; } };
  assertEq(v(rec(1, [])), null);
  assertEq(v(rec(1, [], { ipp: '991234567' })), 'BAD_PAYLOAD');                       // 9 chiffres
  assertEq(v(rec(1, [], { ipp: '99123456789' })), 'BAD_PAYLOAD');                      // 11 chiffres
  assertEq(v(rec(1, [], { ipp: '99123A5678' })), 'BAD_PAYLOAD');
  assertEq(v(rec(2, ['n-importe-quoi'])), 'BAD_PAYLOAD');
  assertEq(v(rec(2, [fid(N2a)])), 'BAD_PAYLOAD');                                       // parent de même numéro
  assertEq(v(rec(3, [fid(N1), fid(N1)])), 'BAD_PAYLOAD');                               // doublon
  assertEq(v(rec(3, ['v0001_RM_20261399T250000Z_aaaaaa'])), 'BAD_PAYLOAD');           // date impossible : pas d'exception
  assertEq(v(rec(1, [], { statut: 'autre' })), 'BAD_PAYLOAD');
  assertEq(v(rec(1, [], { auteur: 'rm' })), 'BAD_PAYLOAD');
  assertEq(v(rec(1, [], { date_saisie: 'hier' })), 'BAD_PAYLOAD');
  assertEq(v(rec(1, [], { items: [] })), 'BAD_PAYLOAD');
  assertEq(v(rec(1, [], { identite: { naissance: '1970-01-02', initiales: 'DM' } })), null);
  assertEq(v(rec(1, [], { identite: { naissance: '02/01/1970', initiales: 'DM' } })), 'BAD_PAYLOAD');
  assertEq(v(rec(1, [], { redirige_vers: { ipp: '1', visite_id: 'x' } })), 'BAD_PAYLOAD');
  assertEq(v(rec(1, [], { origine: { ipp: '9900000002', visite_id: 'v-2', fid: fid(N1) } })), null);
  assertEq(v([]), 'BAD_PAYLOAD'); assertEq(v(null), 'BAD_PAYLOAD');
});

test('B2-15 Champs inconnus recopiés à la réécriture, champs connus non', async () => {
  const res = NVCore.resolveGraph([await gentry(N1, rec(1, []))]);
  const prec = rec(1, [], { futur: { a: [1, 2] }, note_x: 'ok', items: { vieux: 1 }, redirige_vers: { ipp: '9900000002', visite_id: 'v-2' } });
  const out = NVCore.buildContent({ ipp: G_IPP, visite_id: G_VID, episode_id: G_EPI, auteur: 'RM', items: { neuf: 2 } }, res, prec);
  assertEq(out.futur, { a: [1, 2] }); assertEq(out.note_x, 'ok');
  assertEq(out.items, { neuf: 2 }); assert(!('redirige_vers' in out), 'champ connu non recopié');
  assertEq(out.version, 2); assertEq(out.parents, [fid(N1)]); assertEq(out.schema, 1);
});

test('B2-16 buildContent : refus des contenus invalides, redirection et origine acceptées', async () => {
  const res = NVCore.resolveGraph([await gentry(N1, rec(1, []))]);
  const base = { ipp: G_IPP, visite_id: G_VID, episode_id: G_EPI, auteur: 'RM' };
  let code = null;
  try { NVCore.buildContent(Object.assign({}, base, { statut: 'annule' }), res, null); } catch (e) { code = e.code; }
  assertEq(code, 'BAD_INPUT');
  code = null;
  try { NVCore.buildContent(Object.assign({}, base, { ipp: '12' }), res, null); } catch (e) { code = e.code; }
  assertEq(code, 'BAD_INPUT');
  const t = NVCore.buildContent(Object.assign({}, base, { statut: 'annule', motif: 'erreur d\'IPP',
    redirige_vers: { ipp: '9900000002', visite_id: 'v-2' } }), res, null);
  assertEq(t.redirige_vers, { ipp: '9900000002', visite_id: 'v-2' });
  const o = NVCore.buildContent(Object.assign({}, base, { ipp: '9900000002', visite_id: 'v-2',
    origine: { ipp: G_IPP, visite_id: G_VID, fid: fid(N1) } }), NVCore.resolveGraph([]), null);
  assertEq(o.version, 1); assertEq(o.parents, []);
  // aller-retour complet : chiffrement, lecture, validation
  const key = await gkey();
  const lu = await NVCore.readEntry({ nom: gname(1, 'RM', 40, 'abcdef'), bytes: await NVCore.encryptVersion(o, key, 1), key, ipp: '9900000002', visite_id: 'v-2' });
  assert(lu.obj && lu.obj.origine.fid === fid(N1), 'contenu de redirection relu');
});

// ===================== exécution et affichage =====================
async function runAll() {
  const resultsEl = typeof document !== 'undefined' ? document.getElementById('results') : null;
  const summaryEl = typeof document !== 'undefined' ? document.getElementById('summary') : null;
  let pass = 0, fail = 0;

  function show(cls, texte, msg) {
    if (resultsEl) {
      const row = document.createElement('div');
      row.className = 'row ' + cls;
      row.textContent = (cls === 'pass' ? '✅ ' : '❌ ') + texte;
      if (msg) { const m = document.createElement('span'); m.className = 'msg'; m.textContent = msg; row.appendChild(m); }
      resultsEl.appendChild(row);
    } else {
      console.log((cls === 'pass' ? 'PASS ' : 'FAIL ') + texte + (msg ? '\n     ' + msg : ''));
    }
  }

  if (!(globalThis.crypto && globalThis.crypto.subtle)) {
    const m = "WebCrypto indisponible : ouvrez la page dans Chrome ou Edge (https ou fichier local).";
    if (summaryEl) { summaryEl.textContent = m; summaryEl.className = 'ko'; } else console.log(m);
    return { pass: 0, fail: 1 };
  }

  for (const t of _tests) {
    if (t.section) {
      if (resultsEl) { const h = document.createElement('h2'); h.textContent = t.section; resultsEl.appendChild(h); }
      else console.log('\n== ' + t.section);
      continue;
    }
    try { await t.fn(); pass++; show('pass', t.nom); }
    catch (e) { fail++; show('fail', t.nom, e && e.message ? e.message : String(e)); }
  }

  const texte = fail === 0
    ? 'TOUS LES TESTS PASSENT (' + pass + '/' + (pass + fail) + ')'
    : fail + ' ÉCHEC(S) sur ' + (pass + fail) + ' tests';
  if (summaryEl) { summaryEl.textContent = texte; summaryEl.className = fail === 0 ? 'ok' : 'ko'; }
  else console.log('\n' + texte);
  return { pass, fail };
}
// Ne rien exécuter automatiquement hors navigateur (permet de lancer sous Node).
if (typeof document !== 'undefined') runAll();
